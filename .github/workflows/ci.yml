name: Spring Boot CI

on:
  push:
    branches:
      - dev
      - feat/github-actions-ci

  pull_request:
    branches:
      - dev

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Give Maven Wrapper Permission
        working-directory: backend
        run: chmod +x mvnw

      - name: Build Docker Image
        working-directory: backend
        run: docker build -t authapp-backend .